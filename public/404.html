<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Harshit Yadav</title>
  <meta name="theme-color" content="#07060f" />
  <link rel="icon" type="image/svg+xml" href="/myportfolio/favicon.svg" />
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{background:#07060f;color:#e2e0ea;font-family:'JetBrains Mono','SF Mono','Fira Code',monospace;height:100%}
    body{min-height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}

    /* Animated gradient background */
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(139,92,246,.12),transparent 70%),radial-gradient(ellipse 40% 40% at 80% 100%,rgba(236,72,153,.08),transparent 60%);pointer-events:none;z-index:0}

    /* Scanline effect */
    body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);pointer-events:none;z-index:10}

    .container{position:relative;z-index:1;text-align:center;max-width:640px;padding:2rem}

    /* Big glitchy 404 */
    .code{font-size:clamp(6rem,20vw,12rem);font-weight:700;line-height:1;letter-spacing:-.04em;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;position:relative;animation:flicker 4s ease-in-out infinite}
    .code::after{content:'404';position:absolute;left:2px;top:2px;background:linear-gradient(135deg,#06b6d4,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0;animation:glitch 4s ease-in-out infinite}

    @keyframes flicker{0%,100%{opacity:1}50%{opacity:.97}52%{opacity:.9}54%{opacity:1}}
    @keyframes glitch{0%,100%{opacity:0;transform:translate(0)}48%{opacity:0}50%{opacity:.6;transform:translate(-3px,1px)}52%{opacity:.4;transform:translate(2px,-1px)}54%{opacity:0;transform:translate(0)}}

    /* Terminal block */
    .terminal{background:rgba(15,13,25,.8);border:1px solid rgba(139,92,246,.2);border-radius:12px;padding:1.5rem 2rem;margin:2rem auto;text-align:left;font-size:.95rem;line-height:1.9;backdrop-filter:blur(12px);max-width:480px}
    .terminal .dots{display:flex;gap:6px;margin-bottom:1rem}
    .terminal .dots i{width:12px;height:12px;border-radius:50%;display:block}
    .terminal .dots i:nth-child(1){background:#ff5f57}
    .terminal .dots i:nth-child(2){background:#febc2e}
    .terminal .dots i:nth-child(3){background:#28c840}

    .prompt{color:#8b5cf6}
    .cmd{color:#e2e0ea}
    .err{color:#f43f5e}
    .ok{color:#34d399}
    .dim{color:rgba(226,224,234,.4)}
    .caret{display:inline-block;width:8px;height:1.1em;background:#8b5cf6;vertical-align:text-bottom;animation:blink 1s step-end infinite;margin-left:2px}
    @keyframes blink{50%{opacity:0}}

    /* Progress bar */
    .progress{margin-top:.6rem}
    .progress-bar{height:3px;background:rgba(139,92,246,.15);border-radius:2px;overflow:hidden;margin-top:.4rem}
    .progress-fill{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#ec4899);border-radius:2px;animation:fill 3.5s ease-in-out forwards}
    @keyframes fill{to{width:100%}}

    /* CTA */
    .actions{margin-top:2rem;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.6rem;border-radius:8px;font-family:inherit;font-size:.85rem;font-weight:500;text-decoration:none;transition:all .25s ease;cursor:pointer;border:none}
    .btn-primary{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(139,92,246,.3)}
    .btn-ghost{background:transparent;color:#e2e0ea;border:1px solid rgba(139,92,246,.3)}
    .btn-ghost:hover{border-color:#8b5cf6;background:rgba(139,92,246,.08)}

    .hint{margin-top:2.5rem;font-size:.75rem;color:rgba(226,224,234,.3);letter-spacing:.05em}

    /* Floating particles */
    .particle{position:fixed;width:2px;height:2px;background:rgba(139,92,246,.4);border-radius:50%;animation:float linear infinite;pointer-events:none;z-index:0}
    @keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}}

    @media(prefers-reduced-motion:reduce){
      .code,.code::after{animation:none}
      .progress-fill{animation:none;width:100%}
      .particle{display:none}
    }
  </style>
</head>
<body>

  <!-- Floating particles -->
  <div class="particle" style="left:10%;animation-duration:6s;animation-delay:0s"></div>
  <div class="particle" style="left:20%;animation-duration:8s;animation-delay:1s"></div>
  <div class="particle" style="left:35%;animation-duration:7s;animation-delay:2s"></div>
  <div class="particle" style="left:50%;animation-duration:9s;animation-delay:.5s"></div>
  <div class="particle" style="left:65%;animation-duration:6.5s;animation-delay:1.5s"></div>
  <div class="particle" style="left:80%;animation-duration:8.5s;animation-delay:.8s"></div>
  <div class="particle" style="left:90%;animation-duration:7.5s;animation-delay:2.5s"></div>

  <div class="container">
    <div class="code">404</div>

    <div class="terminal">
      <div class="dots"><i></i><i></i><i></i></div>
      <div><span class="prompt">❯</span> <span class="cmd">cd <span id="path">/lost</span></span></div>
      <div><span class="err">bash: directory not found</span></div>
      <div><span class="prompt">❯</span> <span class="ok">→ redirecting to ~/harshit...</span></div>
      <div class="progress">
        <span class="dim" id="countdown">Redirecting in 4s</span>
        <div class="progress-bar"><div class="progress-fill"></div></div>
      </div>
    </div>

    <div class="actions">
      <a href="/myportfolio/" class="btn btn-primary">
        <span>← Go home</span>
      </a>
      <a href="https://github.com/xdominator365/myportfolio" target="_blank" rel="noopener" class="btn btn-ghost">
        <span>View source ↗</span>
      </a>
    </div>

    <p class="hint">// you found a page that doesn't exist. it happens.</p>
  </div>

  <script>
    // Show the actual path the user tried
    var p = location.pathname.replace(/\/myportfolio/,'~');
    document.getElementById('path').textContent = p || '/lost';

    // Countdown + redirect
    var s = 4, el = document.getElementById('countdown');
    var t = setInterval(function(){
      s--;
      if (s <= 0) { clearInterval(t); location.href = '/myportfolio/'; }
      else el.textContent = 'Redirecting in ' + s + 's';
    }, 1000);
  </script>
</body>
</html>
